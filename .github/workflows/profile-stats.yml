name: Update profile statistics

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'staners2/staners2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Verify collection rules
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Refresh public statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/update_stats.py
      - name: Save generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats*.svg assets/stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh profile statistics'
            git push
          fi
