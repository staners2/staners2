      <path d="M0-26 42-3 0 20-42-3Z" fill="#1d304d"/>
      <path d="M0-26 42-3 0 20-42-3Z" fill="#83b1ff" opacity=".12" stroke="none"/>
      <path d="M-28 7V33M-14 15V41M14 15V41M28 7V33" fill="none" opacity=".5"/>
      <path d="M-21-15 21 8" fill="none" opacity=".5"/>
