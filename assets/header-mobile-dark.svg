    <text x="35" y="130" fill="#edf3fc" font-size="66" font-weight="700" letter-spacing="-2">Dima Aratin</text>
    <text x="38" y="177" fill="#edf3fc" font-size="32">DevOps engineer</text>
    <text x="38" y="221" fill="#a8bad3" font-size="23">Kubernetes, automation &amp; integrations.</text>
  </g>
